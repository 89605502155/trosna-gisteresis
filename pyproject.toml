[project]
name = "trosna-gisteresis"
version = "0.1.0"
description = "Hysteresis decision rule with dwell time and cooldown period for streaming resource-imbalance indices"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Andrey Ferubko", email = "ferubko1999@yandex.ru" }
]
requires-python = ">=3.11"
keywords = ["hysteresis", "dwell time", "cooldown", "debounce", "virtualization", "memory ballooning", "KVM"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: System :: Distributed Computing",
]
dependencies = [
    "numpy>=1.26",
]

[build-system]
requires = ["uv_build>=0.11.9,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "matplotlib>=3.8",
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "NPY", "RUF", "SIM", "PT", "C4", "PL"]
# Кириллица в комментариях и строках — не «опасные» символы.
ignore = ["RUF001", "RUF002", "RUF003", "PLR2004", "PLR0913"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N806", "PLR0915"]

[tool.ruff.lint.isort]
known-first-party = ["trosna_gisteresis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra --strict-markers"
xfail_strict = true
filterwarnings = ["error"]
